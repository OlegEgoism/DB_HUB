[tool.ruff]
target-version = "py313"
line-length = 160

# Что включаем
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (импорты)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

# Что часто мешает в FastAPI
ignore = [
    "B008",
]

# Где не проверять
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "frontend",
    "load_data.py",
    "collect_app_code.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
