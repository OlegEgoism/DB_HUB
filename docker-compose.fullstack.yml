services:
  db:
    image: postgres:16-alpine
    container_name: db_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    container_name: db_hub_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 8088
      VITE_API_BASE_URL: http://localhost:8088
      FRONTEND_PORT: 8099
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8088"
      - "8099:8099"

volumes:
  postgres_data:
