services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    container_name: db_hub_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8088
      FRONTEND_PORT: 8099
      VITE_API_BASE_URL: http://localhost:8088
      APP_DATABASE_URL: sqlite+aiosqlite:////app/data/db_hub.sqlite3
    ports:
      - "8088:8088"
      - "8099:8099"
    volumes:
      - db_hub_data:/app/data

volumes:
  db_hub_data:
