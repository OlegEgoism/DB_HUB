services:
  db:
    image: postgres:16-alpine
    container_name: db_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Порт БД наружу по умолчанию не публикуем, чтобы не конфликтовать
    # с локальным PostgreSQL на хосте (ошибка: address already in use).
    # Для внешнего доступа раскомментируйте строки ниже или задайте DB_EXTERNAL_PORT.
    # ports:
    #   - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: db_hub_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: db_hub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:5173"

volumes:
  postgres_data:
