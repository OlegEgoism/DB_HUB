services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.fullstack.prod
      args:
        VITE_API_BASE_URL: http://localhost:8088
    container_name: db_hub_app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8088
      FRONTEND_PORT: 8099
      APP_DATABASE_URL: sqlite+aiosqlite:////app/data/db_hub.sqlite3
      ENCRYPTION_KEY: EBvGmpvcm4nrUrcMjmjfwUB0F0usPXfRCOHVvK3upCo=
      SECRET_KEY: your-super-secret-jwt-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DBHUB_MAP_LOCALHOST_TO_HOST: "1"
      DOCKER_HOST_GATEWAY_HOSTNAME: host.docker.internal
      DOCKER_HOST_GATEWAY_IP: 172.17.0.1
    ports:
      - "8088:8088"
      - "8099:8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - db_hub_data:/app/data

volumes:
  db_hub_data:
