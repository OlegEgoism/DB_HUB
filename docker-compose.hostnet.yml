services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    container_name: db_hub_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8088
      FRONTEND_PORT: 8099
      VITE_API_BASE_URL: http://localhost:8088
      APP_DATABASE_URL: sqlite+aiosqlite:////app/data/db_hub.sqlite3
      DBHUB_MAP_LOCALHOST_TO_HOST: "0"
    network_mode: host
    volumes:
      - db_hub_data:/app/data

volumes:
  db_hub_data:
